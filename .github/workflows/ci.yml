name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the published entry points
        run: |
          node --input-type=module -e "import { SigfoxClient } from 'sigfox-js'; new SigfoxClient({ username: 'u', password: 'p' })"
          node -e "const { SigfoxClient } = require('sigfox-js'); new SigfoxClient({ username: 'u', password: 'p' })"
